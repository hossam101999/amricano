<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scoreboard Offline</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    main {
      padding: 2rem;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.8);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.5);
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    p {
      margin: 0.5rem 0;
      color: #e0e7ff;
    }
  </style>
</head>
<body>
  <main>
    <h1>You are offline</h1>
    <p>The Scoreboard keeps working with the data stored on your device.</p>
    <p>Reconnect or reload the page to sync any new updates.</p>
  </main>
</body>
</html>
